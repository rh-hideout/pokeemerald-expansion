name: CI

on:
  push:
    branches:
      - master
      - upcoming
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  build-roms:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: EMERALD
            target: all
          - version: FIRERED
            target: firered
          - version: LEAFGREEN
            target: leafgreen
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Build ROM (${{ matrix.version }})
        env:
          GAME_VERSION: ${{ matrix.version }}
        run: make ${{ matrix.target }} -j$(nproc) -O

  release:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Build release ROM
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc) release

  test:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
        with:
          cache-key-prefix: 'tools-check'
          extra-tools: |
            tools/patchelf/patchelf
            tools/mgba-rom-test-hydra/mgba-rom-test-hydra

      - name: Build and run tests
        env:
          GAME_VERSION: EMERALD
          TEST: 1
        run: make -j$(nproc) check

  # Gate job: satisfies the "build" branch protection rule.
  # Passes only when all parallel build/test jobs succeed.
  build:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    needs: [build-roms, release, test]
    steps:
      - name: All builds passed
        run: echo "All builds and tests passed."

  docs_validate:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check that SUMMARY.md includes markdown doc files
        run: .github/docs_validate/inclusive_summary.py

  allcontributors:
    if: github.actor == 'allcontributors[bot]'
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Automatically pass for allcontributors
        run: echo "CI automatically passes for allcontributors" && exit 0
